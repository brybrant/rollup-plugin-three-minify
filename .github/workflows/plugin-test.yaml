name: Plugin test (bun + rolldown)

on: workflow_dispatch

jobs:
  build:
    name: Plugin test (bun + rolldown)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
      - name: Build plugin
        run: bun run build
      - name: Run tests
        run: bun run test