name: Bun test

on: workflow_dispatch

jobs:
  build:
    name: build-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Link package
        run: bun link
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps
      - name: Run test
        run: bun test